name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (schema validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.23"
      - run: python contracts/validate_examples.py

  dotnet:
    name: .NET (bridge domain + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Lantern.sln -c Release
      # MTP mode of `dotnet test` (.NET 10, opted in via global.json) uses --solution.
      - run: dotnet test --solution Lantern.sln -c Release --no-build

  kotlin:
    name: Kotlin (mobile core + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:build
        working-directory: src/mobile

  android:
    name: Android (app assemble + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
        working-directory: src/mobile

  smoke-e2e:
    name: Cross-language e2e smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x scripts/smoke-e2e/run.sh && scripts/smoke-e2e/run.sh

  smoke-mcp:
    name: MCP stdio smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test plugin/lantern-plugin/bridge/Lantern.Bridge.Tests -c Release --filter FullyQualifiedName~McpStdioSmokeTests
